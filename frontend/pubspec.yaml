name: frontend
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: 6.0.1
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  supabase_flutter: 2.17.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_nav_bar: ^5.0.7
  dio: ^5.11.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/yuemnoi.png"
  adaptive_icon_background: "#9251D0"
  adaptive_icon_foreground: "assets/images/yuemnoi.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - assets/images/
    - assets/icons/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Prompt-Bold.ttf
          weight: 700
