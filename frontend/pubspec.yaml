name: frontend
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: 6.0.1
  google_fonts: ^8.1.0
  image: ^4.13.1
  image_picker: ^1.2.3
  supabase_flutter: 2.17.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_nav_bar: ^5.0.7
  dio: ^5.11.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  flutter_image_compress: ^2.5.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  permission_handler: ^12.0.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  gal: ^2.3.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  flutter_markdown: ^0.7.6
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  font_awesome_flutter: ^11.0.0
  camera: 0.12.1
  pinput: 6.0.2
  eventflux: ^3.0.2
  form_builder_validators: ^11.3.0
  phone_numbers_parser: ^9.0.28
  skeletonizer: ^3.0.0
  photo_view: ^0.15.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_chat_ui: 2.11.1
  flutter_chat_core: ^2.9.1
  http: ^1.6.0
  google_sign_in: 7.2.0
  firebase_core: 3.13.0
  firebase_messaging: 15.2.5

dev_dependencies:
  camera_platform_interface: ^2.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/yuemnoi.png"
  adaptive_icon_background: "#9251D0"
  adaptive_icon_foreground: "assets/images/yuemnoi.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/data/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Prompt-Bold.ttf
          weight: 700
