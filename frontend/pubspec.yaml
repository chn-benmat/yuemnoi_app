name: frontend
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: 6.0.1
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  supabase_flutter: 2.17.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_nav_bar: ^5.0.7
  dio: ^5.11.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  flutter_image_compress: ^2.5.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  permission_handler: ^12.0.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  shared_preferences: ^2.5.5
  gal: ^2.3.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  flutter_markdown: ^0.7.6
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/yuemnoi.png"
  adaptive_icon_background: "#9251D0"
  adaptive_icon_foreground: "assets/images/yuemnoi.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - assets/images/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Prompt-Bold.ttf
          weight: 700
